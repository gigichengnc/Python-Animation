[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pixel-train"
version = "0.4.0"
description = "A deterministic Python pixel-animation engine for a cinematic train journey."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "Pillow>=10.0",
  "imageio>=2.34",
  "imageio-ffmpeg>=0.5",
  "numpy>=1.26",
]

[project.scripts]
pixel-train = "pixel_train.render:main"
pixel-train-v04 = "pixel_train.render_v04:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
